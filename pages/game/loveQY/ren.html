<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极简电子小人 · 换装版</title>
<style>
  :root {
    --male:        #5eead4;
    --male-glow:   rgba(94, 234, 212, 0.40);
    --male-fill:   rgba(94, 234, 212, 0.07);
    --female:      #f9a8d4;
    --female-glow: rgba(249, 168, 212, 0.40);
    --female-fill: rgba(249, 168, 212, 0.07);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: radial-gradient(circle at 50% 40%, #16232e 0%, #0a1117 55%, #04070a 100%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #5eead4;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(94, 234, 212, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94, 234, 212, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  /* ---------- SVG 容器 ---------- */
  .bot {
    --line: var(--male);
    --glow: var(--male-glow);
    --fill: var(--male-fill);
    width: min(320px, 72vw, 36vh);
    height: auto;
    display: block;
    position: relative;
    z-index: 1;
  }
  .figure.female {
    --line: var(--female);
    --glow: var(--female-glow);
    --fill: var(--female-fill);
  }

  /* 衣服 / 头发 / 配饰 默认色 */
  .figure.male {
    --cloth: #5eead4;
    --cloth-fill: rgba(94, 234, 212, 0.08);
    --cloth-glow: rgba(94, 234, 212, 0.35);
    --hair: #14b8a6;
    --hair-fill: rgba(20, 184, 166, 0.22);
    --hair-glow: rgba(20, 184, 166, 0.35);
    --acc: #2dd4bf;
    --acc-dark: #0f766e;
    --acc-glow: rgba(45, 212, 191, 0.45);
  }
  .figure.female {
    --cloth: #f9a8d4;
    --cloth-fill: rgba(249, 168, 212, 0.08);
    --cloth-glow: rgba(249, 168, 212, 0.35);
    --hair: #ec4899;
    --hair-fill: rgba(236, 72, 153, 0.22);
    --hair-glow: rgba(236, 72, 153, 0.35);
    --acc: #f472b6;
    --acc-dark: #be185d;
    --acc-glow: rgba(244, 114, 182, 0.45);
  }

  /* ---------- 图形样式 ---------- */
  .head {
    fill: var(--fill);
    stroke: var(--line);
    stroke-width: 3.5;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 8px var(--glow));
  }
  .body {
    fill: var(--cloth-fill);
    stroke: var(--cloth);
    stroke-width: 3.5;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 8px var(--cloth-glow));
    transition: stroke 0.25s ease, fill 0.25s ease;
  }
  .hair {
    fill: var(--hair-fill);
    stroke: var(--hair);
    stroke-width: 3.5;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 8px var(--hair-glow));
    transition: stroke 0.25s ease, fill 0.25s ease, opacity 0.3s ease;
  }
  /* 头发隐藏状态 */
  .hair.off {
    opacity: 0;
    pointer-events: none;
  }
  .stroke {
    fill: none;
    stroke: var(--line);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .solid { fill: var(--line); }
  .blush { fill: #ff8fb1; opacity: 0.55; }
  .tear  { fill: #7dd3fc; }
  .zzz {
    fill: var(--line);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    opacity: 0.85;
  }

  /* ---------- 配饰（实色填充） ---------- */
  .acc {
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .acc.on { opacity: 1; }

  .acc-shape {
    fill: var(--acc);
    stroke: var(--acc-dark);
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
    filter: drop-shadow(0 0 7px var(--acc-glow));
  }
  .lens {
    fill: var(--acc);
    stroke: var(--acc-dark);
    stroke-width: 2.5;
    opacity: 0.72;
    filter: drop-shadow(0 0 6px var(--acc-glow));
  }
  .acc-line {
    fill: none;
    stroke: var(--acc-dark);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px var(--acc-glow));
  }
  .acc-hl {
    fill: #ffffff;
    opacity: 0.35;
  }

  /* ---------- 表情切换 ---------- */
  .face {
    opacity: 0;
    transition: opacity 0.22s ease;
    pointer-events: none;
  }
  .face.active { opacity: 1; }

  .eye {
    transform-box: fill-box;
    transform-origin: center;
  }
  .face[data-f="normal"] .eye { animation: blink 4.2s infinite; }
  @keyframes blink {
    0%, 93%, 100% { transform: scaleY(1); }
    95.5%, 97.5%  { transform: scaleY(0.08); }
  }

  .tear { animation: tearDrop 1.9s ease-in infinite; }
  @keyframes tearDrop {
    0%   { transform: translateY(0);    opacity: 0; }
    18%  {                              opacity: 1; }
    85%  { transform: translateY(24px); opacity: 0; }
    100% { transform: translateY(24px); opacity: 0; }
  }

  .zzz { animation: zfloat 2.2s ease-in-out infinite; }
  .zzz:nth-of-type(2) { animation-delay: 0.45s; }
  .zzz:nth-of-type(3) { animation-delay: 0.9s; }
  @keyframes zfloat {
    0%, 100% { transform: translateY(0);    opacity: 0.25; }
    50%      { transform: translateY(-6px); opacity: 1; }
  }

  .arm-l {
    transform-box: fill-box;
    transform-origin: 100% 0%;
    animation: armL 2.6s ease-in-out infinite;
  }
  .arm-r {
    transform-box: fill-box;
    transform-origin: 0% 0%;
    animation: armR 2.6s ease-in-out infinite;
  }
  @keyframes armL {
    0%, 100% { transform: rotate(8deg); }
    50%      { transform: rotate(-8deg); }
  }
  @keyframes armR {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }

  /* ---------- 身体动态 ---------- */
  .figure {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: float 3.6s ease-in-out infinite;
  }

  .bot[data-mood="happy"]  .figure { animation: bounce 1s    ease-in-out infinite; }
  .bot[data-mood="sad"]    .figure { animation: droop  3s    ease-in-out infinite; }
  .bot[data-mood="angry"]  .figure { animation: shake  0.16s linear infinite; }
  .bot[data-mood="wow"]    .figure { animation: pop    1.15s ease-in-out infinite; }
  .bot[data-mood="sleepy"] .figure { animation: sway   3.8s  ease-in-out infinite; }
  .bot[data-mood="love"]   .figure { animation: beat   1.15s ease-in-out infinite; }
  .bot[data-mood="dizzy"]  .figure { animation: tilt   1.4s  ease-in-out infinite; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    25%      { transform: translateY(-15px) scale(0.98, 1.03); }
    50%      { transform: translateY(0) scale(1.04, 0.95); }
    70%      { transform: translateY(-6px) scale(1, 1); }
    86%      { transform: translateY(0) scale(1.01, 0.99); }
  }
  @keyframes droop {
    0%, 100% { transform: translateY(2px) rotate(-2.5deg); }
    50%      { transform: translateY(9px) rotate(-2.5deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    25%      { transform: translateX(-2.5px) rotate(-1.2deg); }
    75%      { transform: translateX(2.5px)  rotate(1.2deg); }
  }
  @keyframes pop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    15%      { transform: translateY(-16px) scale(0.95, 1.06); }
    42%      { transform: translateY(0) scale(1.06, 0.94); }
    62%      { transform: translateY(0) scale(1, 1); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(3.5deg); }
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15%      { transform: scale(1.07); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.05); }
    60%      { transform: scale(1); }
  }
  @keyframes tilt {
    0%, 100% { transform: rotate(-7deg) translateY(0); }
    50%      { transform: rotate(7deg) translateY(-2px); }
  }

  /* ---------- 表情按钮 ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: min(420px, 92vw);
    position: relative;
    z-index: 1;
  }
  .btn {
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(94, 234, 212, 0.32);
    background: rgba(94, 234, 212, 0.05);
    color: rgba(94, 234, 212, 0.82);
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover {
    border-color: #5eead4;
    color: #5eead4;
    background: rgba(94, 234, 212, 0.12);
    transform: translateY(-1px);
  }
  .btn.on {
    background: #5eead4;
    border-color: #5eead4;
    color: #04120e;
    font-weight: 600;
    box-shadow: 0 0 14px rgba(94, 234, 212, 0.5);
  }

  /* ---------- 配饰 / 头发 按钮 ---------- */
  .accessories {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    position: relative;
    z-index: 1;
  }
  .acc-btn {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(196, 181, 253, 0.35);
    background: rgba(196, 181, 253, 0.06);
    color: rgba(196, 181, 253, 0.85);
    font-size: 12.5px;
    font-family: inherit;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .acc-btn:hover {
    border-color: #c4b5fd;
    color: #c4b5fd;
    background: rgba(196, 181, 253, 0.14);
    transform: translateY(-1px);
  }
  .acc-btn.on {
    background: #c4b5fd;
    border-color: #c4b5fd;
    color: #0a1117;
    font-weight: 600;
    box-shadow: 0 0 14px rgba(196, 181, 253, 0.5);
  }

  /* 头发按钮用不同的强调色 */
  .hair-btn {
    border-color: rgba(253, 186, 116, 0.4);
    background: rgba(253, 186, 116, 0.06);
    color: rgba(253, 186, 116, 0.9);
  }
  .hair-btn:hover {
    border-color: #fdba74;
    color: #fdba74;
    background: rgba(253, 186, 116, 0.14);
  }
  .hair-btn.on {
    background: #fdba74;
    border-color: #fdba74;
    color: #1a1206;
    box-shadow: 0 0 14px rgba(253, 186, 116, 0.5);
  }

  /* ---------- 调色板 ---------- */
  .colors {
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    z-index: 1;
  }
  .color-row {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .color-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.38);
    letter-spacing: 0.5px;
    width: 32px;
    text-align: right;
    flex: none;
  }
  .swatches {
    display: flex;
    gap: 6px;
  }
  .swatch {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--c);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .swatch:hover { transform: scale(1.22); }
  .swatch.on {
    box-shadow: 0 0 0 2px #0a1117, 0 0 0 3.5px var(--c);
  }
  /* 头发隐藏时，对应头发调色板变暗 */
  .swatches.disabled {
    opacity: 0.25;
    pointer-events: none;
  }
</style>
</head>

<div class="controls">

</div>

<div class="accessories">
  <button class="acc-btn hair-btn on" data-hair="male">男发</button>
  <button class="acc-btn hair-btn on" data-hair="female">女发</button>
  <button class="acc-btn" data-acc="hat">帽子</button>
  <button class="acc-btn" data-acc="scarf">围巾</button>
  <button class="acc-btn" data-acc="glasses">眼镜</button>
</div>

<div class="colors">
  <div class="color-row">
    <span class="color-label">男衣</span>
    <div class="swatches" data-target="male-cloth"   data-default="0"></div>
  </div>
  <div class="color-row">
    <span class="color-label">男发</span>
    <div class="swatches" data-target="male-hair"    data-default="1"></div>
  </div>
  <div class="color-row">
    <span class="color-label">女衣</span>
    <div class="swatches" data-target="female-cloth" data-default="2"></div>
  </div>
  <div class="color-row">
    <span class="color-label">女发</span>
    <div class="swatches" data-target="female-hair"  data-default="3"></div>
  </div>
</div>

<script>
  /* ---------------- 调色板 ---------------- */
  const PALETTE = [
    '#5eead4', // 青
    '#14b8a6', // 深青
    '#f9a8d4', // 粉
    '#ec4899', // 玫红
    '#c4b5fd', // 紫
    '#fde68a', // 黄
    '#fdba74', // 橙
    '#93c5fd'  // 蓝
  ];

  const hexToRgb = (hex) => {
    const h = hex.replace('#', '');
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16)
    ];
  };
  const rgba = (hex, a) => `rgba(${hexToRgb(hex).join(',')},${a})`;
  const darken = (hex, amt) => {
    const [r, g, b] = hexToRgb(hex);
    return `rgb(${Math.round(r * amt)},${Math.round(g * amt)},${Math.round(b * amt)})`;
  };

  function applyColor(target, color) {
    const who  = target.split('-')[0];
    const part = target.split('-')[1];
    const fig  = document.querySelector('.figure.' + who);
    if (!fig) return;

    if (part === 'cloth') {
      fig.style.setProperty('--cloth', color);
      fig.style.setProperty('--cloth-fill', rgba(color, 0.08));
      fig.style.setProperty('--cloth-glow', rgba(color, 0.35));
      fig.style.setProperty('--acc', color);
      fig.style.setProperty('--acc-dark', darken(color, 0.55));
      fig.style.setProperty('--acc-glow', rgba(color, 0.45));
    } else {
      fig.style.setProperty('--hair', color);
      fig.style.setProperty('--hair-fill', rgba(color, 0.22));
      fig.style.setProperty('--hair-glow', rgba(color, 0.35));
    }
  }

  document.querySelectorAll('.swatches').forEach(box => {
    const target     = box.dataset.target;
    const defaultIdx = Number(box.dataset.default) || 0;

    PALETTE.forEach((c, i) => {
      const sw = document.createElement('button');
      sw.className = 'swatch' + (i === defaultIdx ? ' on' : '');
      sw.style.setProperty('--c', c);
      sw.title = c;
      sw.addEventListener('click', () => {
        box.querySelectorAll('.swatch').forEach(s => s.classList.remove('on'));
        sw.classList.add('on');
        applyColor(target, c);
      });
      box.appendChild(sw);
    });

    applyColor(target, PALETTE[defaultIdx]);
  });

  /* ---------------- 头发显示开关 ---------------- */
  document.querySelectorAll('.hair-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const who  = btn.dataset.hair;
      const next = !btn.classList.contains('on');
      btn.classList.toggle('on', next);

      // 切换对应角色的头发
      document
        .querySelectorAll('.hair[data-hair="' + who + '"]')
        .forEach(h => h.classList.toggle('off', !next));

      // 对应头发调色板变灰/恢复
      const sw = document.querySelector('.swatches[data-target="' + who + '-hair"]');
      if (sw) sw.classList.toggle('disabled', !next);
    });
  });

  /* ---------------- 配饰开关 ---------------- */
  document.querySelectorAll('.acc-btn[data-acc]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key  = btn.dataset.acc;
      const next = !btn.classList.contains('on');
      btn.classList.toggle('on', next);
      document
        .querySelectorAll('.acc[data-acc="' + key + '"]')
        .forEach(el => el.classList.toggle('on', next));
    });
  });

  /* ---------------- 表情切换 ---------------- */
  const bot   = document.querySelector('.bot');
  const faces = [...document.querySelectorAll('.face')];
  const btns  = [...document.querySelectorAll('.btn')];
  const order = [...new Set(faces.map(f => f.dataset.f))];

  let current = 0;
  let timer   = null;

  function show(name) {
    current = order.indexOf(name);
    faces.forEach(f => f.classList.toggle('active', f.dataset.f === name));
    btns.forEach(b => b.classList.toggle('on', b.dataset.f === name));
    bot.dataset.mood = name;
  }

  function startAuto() {
    clearInterval(timer);
    timer = setInterval(() => {
      show(order[(current + 1) % order.length]);
    }, 2800);
  }

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      show(btn.dataset.f);
      startAuto();
    });
  });

  show('normal');
  startAuto();
</script>

</body>
